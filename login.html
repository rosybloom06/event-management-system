<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Venuro</title><link rel="stylesheet" href="css/style.css">
</head><body>
<header class="site-header"><nav class="navbar"><a href="index.html" class="logo">Venuro<span>.</span></a><div class="nav-links"></div></nav></header>
<main class="auth-page"><section class="auth-card" aria-labelledby="login-title">
<span class="section-label">WELCOME BACK</span><h1 id="login-title">Sign in to Venuro</h1><p>Access your bookings and discover what’s next.</p>
<form id="login-form"><div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required></div>
<button type="submit" class="btn">Login</button></form>
<p id="login-message" aria-live="polite"></p><p class="auth-link">New to Venuro? <a href="register.html">Create an account</a></p>
</section></main>
<footer>© 2026 Venuro · Event Management System</footer>
<script src="js/app.js"></script><script src="js/nav.js"></script><script src="js/login.js"></script>
</body></html>
