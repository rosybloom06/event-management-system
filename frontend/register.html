<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Venuro</title><link rel="stylesheet" href="css/style.css">
</head><body>
<header class="site-header"><nav class="navbar"><a href="index.html" class="logo">Venuro<span>.</span></a><div class="nav-links"></div></nav></header>
<main class="auth-page"><section class="auth-card" aria-labelledby="register-title">
<span class="section-label">GET STARTED</span><h1 id="register-title">Create your account</h1><p>Join Venuro and keep every booking in one place.</p>
<form id="register-form"><div class="field"><label for="name">Full name</label><input type="text" id="name" autocomplete="name" placeholder="Your name" required></div>
<div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required></div>
<button type="submit" class="btn">Create account</button></form>
<p id="register-message" aria-live="polite"></p><p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
</section></main>
<footer>© 2026 Venuro · Event Management System</footer>
<script src="js/app.js"></script><script src="js/nav.js"></script><script src="js/register.js"></script>
</body></html>
